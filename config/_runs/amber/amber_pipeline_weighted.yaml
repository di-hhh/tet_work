# @package _global_

defaults:
  - _amber_weighted
  - override /task: pipeline_condition_aware
  - _self_

exp_name: amber_pipeline_weighted
_version: 1
idx: ambpw100

trainer:
  max_epochs: 101

task:
  pipeline_output_root: D:/SITP/tet_work/dataest-pipeline/output/condition_aware_dataset_generation/default_fix_budget_run
  physics_weight_source: pipeline_indicator
  physics_feature_source: pipeline_indicator

algorithm:
  enable_physics_correction_branch: False
  mesh_metrics:
    physics_weighted_projected_l2_error: True
  weighted_imitation:
    enabled: True
    metric_use_physics_weights: True
    datasets: [pipeline_condition_aware]
    weight_source_mode: pipeline_indicator
    auto_prepare: False
    fallback_to_ones: False
