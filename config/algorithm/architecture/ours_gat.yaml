defaults:
  - default_gnn
  - _self_

name: gat  # use gat architecture

latent_dimension: 64  # 潜在维度

create_graph_copy: True  # whether to create a copy of the used graph before the forward pass or not
# 是否在前向传播前为使用的图创建副本

assert_graph_shapes: False  # whether to assert correct shapes for the graph before each forward pass or not
# 是否在每次前向传播前检查图结构的形状是否正确

edge_dropout: 0.1  # dropout rate for the edges of the graph. Will remove the edge from the graph
# with the given probability during training only
# 图中边的丢弃率（Dropout）。仅在训练期间以指定概率随机移除图中的边。

stack:  # used for edge-aware gat

  layer_norm: inner   # which kind of layer normalization to use. null/None for no layer norm,
  # "outer" for layer norm around each full message passing step, "inner" for layer norm after each message
  # 选择使用哪种层归一化方式。null/None 表示不使用层归一化，
  # "outer" 表示在每个完整的消息传递步骤周围进行层归一化，"inner" 表示在每个消息后进行层归一化

  num_steps: 20                # 4、6、8、10、12、16、20
  num_heads: 4                # 注意力头数
  use_edge_in_value: True     # message value 里是否加 e

  residual_connections: inner # 残差连接

  apply_attention: True              # 是否使用注意力机制

  transform_edge_for_att_calc: True  # 计算注意力前是否变换边特征
  apply_attention_on_edge: True      # 是否对边特征也应用注意力
  aggregate_edge: True               # 是否聚合边特征到节点表示
  edge_dependent_attention: True     # 注意力是否依赖边特征

  self_loop: False                   # 是否添加自连接（类似残差连接）
  self_node_transform: False         # 自连接时是否变换节点特征

  feat_drop: 0.05        # 节点特征 Dropout
  attn_drop: 0.05        # 注意力分数 Dropout
  edge_feat_drop: 0.05   # 边特征 Dropout

  use_batch_norm: True

  mlp:  # edge update mlp配置
    activation_function: leakyrelu
    num_layers: 2
    add_output_layer: False
    regularization:
      dropout: 0
      spectral_norm: False
      latent_normalization: null