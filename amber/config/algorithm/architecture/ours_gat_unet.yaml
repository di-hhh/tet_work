# Edge-Aware GAT U-Net 架构配置
# 使用多尺度 U-Net 式 Edge-Aware GAT 网络替代原始的 flat EdgeAwareGatStack。
# 通过 graclus 图粗化构建多层层次，编码器从细到粗，解码器从粗到细，skip connection 融合多尺度信息。

defaults:
  - default_gnn
  - _self_

name: gat  # 保持 name: gat，因为上层 EdgeAwareGatBase 通过此名称注册，
           # U-Net 只是替换了内部的 edge_aware_gat_stack，对外接口不变。

latent_dimension: 64

create_graph_copy: True
assert_graph_shapes: False
edge_dropout: 0.1

stack:
  stack_type: unet          # 关键字段：告诉 EdgeAwareGatBase 使用 EdgeAwareGATUNet
  num_levels: 4             # 图层次的层数（G_0 ~ G_2，共3层）
  steps_per_level: 5        # 每层做几轮 EdgeAwareGATBlock（编码器和解码器各 3 轮/层）

  # 以下配置透传给每个 EdgeAwareGATBlock
  stack_config:
    layer_norm: inner
    residual_connections: inner

    num_heads: 4
    apply_attention: True
    transform_edge_for_att_calc: True
    apply_attention_on_edge: True
    aggregate_edge: True
    edge_dependent_attention: True

    self_loop: False
    self_node_transform: False

    feat_drop: 0.05
    attn_drop: 0.05
    edge_feat_drop: 0.05
    use_batch_norm: False

    mlp:
      activation_function: leakyrelu
      num_layers: 2
      add_output_layer: False
      regularization:
        dropout: 0
        spectral_norm: False
        latent_normalization: null
